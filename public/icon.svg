<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Navy background -->
  <rect width="512" height="512" fill="#241E4E" rx="64" ry="64"/>

  <!-- Water body (rainfall blue, matching the dashboard's rain color) -->
  <path d="M 64 280 Q 128 240 192 280 T 320 280 T 448 280 L 448 448 L 64 448 Z" fill="#0039A6"/>

  <!-- Wave stroke (paper color, echoing the favicon) -->
  <path d="M 64 256 Q 128 216 192 256 T 320 256 T 448 256" stroke="#F6F4EF" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Secondary wave for depth -->
  <path d="M 64 320 Q 128 280 192 320 T 320 320 T 448 320" stroke="#F6F4EF" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>
