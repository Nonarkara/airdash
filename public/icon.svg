<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Navy background -->
  <rect width="512" height="512" fill="#241E4E" rx="64" ry="64"/>

  <!-- Hazy sun (dust-season yellow, matching the watch-band color) -->
  <circle cx="352" cy="152" r="72" fill="#F0B400"/>

  <!-- Haze bands (paper color, echoing the favicon) -->
  <path d="M 72 264 H 440" stroke="#F6F4EF" stroke-width="34" stroke-linecap="round"/>
  <path d="M 72 340 H 356" stroke="#F6F4EF" stroke-width="26" stroke-linecap="round" opacity="0.7"/>
  <path d="M 72 408 H 440" stroke="#F6F4EF" stroke-width="20" stroke-linecap="round" opacity="0.45"/>

  <!-- Dust motes (elevated orange, the PM accent) -->
  <circle cx="404" cy="340" r="14" fill="#E86A10"/>
  <circle cx="132" cy="196" r="10" fill="#E86A10" opacity="0.8"/>
</svg>
